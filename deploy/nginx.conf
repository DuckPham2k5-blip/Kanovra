# TaskForge — Nginx reverse proxy for a Hostinger VPS.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/taskforge
#   sudo ln -sf /etc/nginx/sites-available/taskforge /etc/nginx/sites-enabled/taskforge
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is issued by certbot:
#   sudo certbot --nginx -d taskforge.example.com -d www.taskforge.example.com
# Certbot rewrites the listen directives below and adds the certificate paths.

upstream taskforge_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate-limit the webhook and auth endpoints; they are the only unauthenticated
# write paths in the app.
limit_req_zone $binary_remote_addr zone=taskforge_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name taskforge.example.com www.taskforge.example.com;

    # Certbot's ACME challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taskforge.example.com www.taskforge.example.com;

    # --- filled in by certbot ---
    # ssl_certificate     /etc/letsencrypt/live/taskforge.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/taskforge.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/taskforge.access.log;
    error_log  /var/log/nginx/taskforge.error.log;

    # Uploads and server-action payloads (board reorders) stay well under this.
    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Immutable build output — cache hard, never revalidate.
    location /_next/static/ {
        proxy_pass http://taskforge_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/ {
        limit_req zone=taskforge_api burst=40 nodelay;
        proxy_pass http://taskforge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://taskforge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

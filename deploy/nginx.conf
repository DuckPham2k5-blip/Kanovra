# Kanovra — Nginx reverse proxy for a Hostinger VPS.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kanovra
#   sudo ln -sf /etc/nginx/sites-available/kanovra /etc/nginx/sites-enabled/kanovra
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is issued by certbot:
#   sudo certbot --nginx -d kanovra.example.com -d www.kanovra.example.com
# Certbot rewrites the listen directives below and adds the certificate paths.

upstream kanovra_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate-limit the webhook and auth endpoints; they are the only unauthenticated
# write paths in the app.
limit_req_zone $binary_remote_addr zone=kanovra_api:10m rate=20r/s;

# Server Actions are POSTs to the page's own URL rather than to /api/, so the
# zone above never applied to them. An empty key disables limiting for a
# request, which is how this restricts itself to writes without needing a
# second location block: GETs map to "" and pass through untouched.
#
# This is the outer of two limits. The application also caps writes per signed-
# in user (see src/lib/rate-limit.ts); this one is per IP and exists to shed a
# flood at the edge before Node spends anything on it.
map $request_method $kanovra_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $kanovra_write_key zone=kanovra_writes:10m rate=10r/s;

# nginx sheds a limited request with 503 by default, which tells anything
# watching uptime that the service is down and gives the client nothing to back
# off against. The application's own per-user limiter already answers 429 with a
# Retry-After (src/middleware.ts), and one overload should not produce two
# different statuses depending on which of the two limiters happened to see it.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name kanovra.example.com www.kanovra.example.com;

    # Certbot's ACME challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2`, not the newer `http2 on;` directive. That directive
    # only exists from nginx 1.25.1, and the two Ubuntu LTS releases a Hostinger
    # VPS is likely to be running ship 1.18 (22.04) and 1.24 (24.04). On both,
    # `http2 on;` is not a warning — `nginx -t` fails with `unknown directive`
    # and the config never loads at all. Checked against 1.18, 1.24 and 1.31 in
    # containers: this form passes all three, and the newest only warns that it
    # is deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kanovra.example.com www.kanovra.example.com;

    # --- filled in by certbot ---
    # ssl_certificate     /etc/letsencrypt/live/kanovra.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kanovra.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kanovra.access.log;
    error_log  /var/log/nginx/kanovra.error.log;

    # Uploads and server-action payloads (board reorders) stay well under this.
    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Immutable build output — cache hard, never revalidate.
    location /_next/static/ {
        proxy_pass http://kanovra_upstream;

        # Inert as it stands: no `proxy_cache_path`/`proxy_cache` is defined, so
        # nothing is cached here and only the Cache-Control below has any effect.
        # Kept as the place to switch a cache zone on if one is ever wanted.
        proxy_cache_valid 200 365d;

        # The four security headers repeat the server-level block on purpose.
        # `add_header` does not merge: a location that defines any `add_header`
        # of its own replaces the inherited set entirely, so adding Cache-Control
        # here silently stripped nosniff, the frame options, the referrer policy
        # and HSTS from every script and stylesheet the app serves. Found by
        # curling through a running nginx, not by reading the manual.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Live updates (Server-Sent Events). This has to come before /api/ so the
    # longer-lived settings win — nginx picks the most specific prefix, but the
    # defaults below would otherwise cut every stream after 60s.
    location /api/realtime/ {
        proxy_pass http://kanovra_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Without these three the stream does not work at all: buffering holds
        # events until the buffer fills, gzip adds a second layer of the same
        # problem, and the default read timeout closes an idle connection long
        # before anything interesting happens.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;

        # Excluded from the API rate limit: one long-lived connection per open
        # tab is normal here and must not eat a burst allowance.
    }

    location /api/ {
        limit_req zone=kanovra_api burst=40 nodelay;
        proxy_pass http://kanovra_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        # Applies to POSTs only, by way of the map above — page loads are
        # unaffected. `burst` absorbs the bursts a real session produces, such
        # as reordering several cards in quick succession.
        limit_req zone=kanovra_writes burst=30 nodelay;

        proxy_pass http://kanovra_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanovra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    volumes:
      - taskforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the app itself in Docker.
  #   docker compose --profile app up -d --build
  # Leave it out for local development — `npm run dev` against the db above is
  # faster and gives you hot reload.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: kanovra-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge?schema=public
      DIRECT_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge?schema=public
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # Attachments live on a named volume: the container filesystem is
      # replaced on every redeploy, so anything written inside the image is
      # lost the first time you ship a change.
      UPLOAD_DIR: /data/uploads
    volumes:
      - kanovra-uploads:/data/uploads
    ports:
      - "3000:3000"

  # Migration, chạy một lần rồi thôi:
  #   docker compose --profile migrate run --rm migrate
  #
  # Nó dựng từ stage `builder` chứ không phải image runner, vì runner cố tình
  # không mang theo Prisma CLI — xem chú thích trong Dockerfile. Stage builder
  # dùng chung mọi layer với service `app` nên không phải build lại từ đầu.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge?schema=public
      DIRECT_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  # Kept as taskforge-pgdata on purpose — renaming it would point Postgres at
  # a fresh empty volume and orphan the existing database.
  taskforge-pgdata:
  kanovra-uploads:
